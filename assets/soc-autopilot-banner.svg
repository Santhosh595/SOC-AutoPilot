<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">SOC AutoPilot</title>
  <desc id="desc">Autonomous Splunk alert investigation in under 2 minutes</desc>

  <!-- flat background -->
  <rect width="960" height="240" fill="#0d1117"/>

  <!-- wordmark -->
  <text x="80" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#3fb950">❯</text>
  <text x="118" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#e6edf3">SOC AutoPilot</text>

  <!-- tagline -->
  <text x="80" y="96" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#8b949e">Autonomous Splunk alert investigation in under 2 minutes</text>

  <!-- divider -->
  <line x1="80" y1="116" x2="880" y2="116" stroke="#21262d" stroke-width="1.5"/>

  <!-- terminal window -->
  <rect x="80" y="136" width="800" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- window dots -->
  <circle cx="104" cy="154" r="5" fill="#ff5f56"/>
  <circle cx="124" cy="154" r="5" fill="#ffbd2e"/>
  <circle cx="144" cy="154" r="5" fill="#27c93f"/>

  <!-- window title -->
  <text x="480" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">soc-autopilot — splunk investigation agent</text>

  <!-- prompt line -->
  <text x="112" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#3fb950">$</text>
  <text x="132" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3">soc-autopilot investigate --alert ALERT-0042</text>

  <!-- output line -->
  <text x="112" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">→ TRUE_POSITIVE · severity: high · SPL rule written · 1m42s</text>
</svg>
