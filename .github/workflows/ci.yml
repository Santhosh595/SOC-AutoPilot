# CI: run the test suite on every push to main and every PR targeting it.
# The tests cover the agent's pure logic -- IOC extraction, threat-level
# mapping, private-IP detection and the knowledge base -- and need no
# Splunk, no LLM key and no ABUSEIPDB_API_KEY.
# Actions are pinned by full SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v
